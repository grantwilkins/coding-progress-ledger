# Model profiles. Two architecturally-derived knobs:
#   kv_bytes_per_token         — KV-cache size per token (bf16)
#   single_stream_prefill_tok_s — per-stream prefill rate at T_ref=100k tokens
#                                 on 8×H100 SXM5, MFU=0.35
# The crossover bandwidth (above which KV-transfer beats replay) follows from
# both:  B* = 8 * kv_bytes_per_token * single_stream_prefill_tok_s.
#
# Five profiles bracket the realistic 2025-2026 design space. The MVP bench
# defaults to `compact_kv` (DeepSeek-V3 MLA, BF16); R3 (Workstream R3) sweeps
# the full set to test whether architecture flips the regime label.
# All values cross-checked against
# `kv-transfer-early-experiment/prefill-breakeven.py` and HuggingFace
# config.json files for the real models cited.

models:
  compact_kv:
    active_params_b: 32
    kv_bytes_per_token: 70272
    single_stream_prefill_tok_s: 14659
    notes: >-
      Kimi-K2.6-class MLA (1T total / 32B active, 61 softmax layers,
      256K context). MLA-style compressed KV: kv_bpt = L × (kv_lora_rank
      + qk_rope_dim) × 2 (bf16) = 61 × (512 + 64) × 2 = 70,272. Per-stream
      prefill at T_ref=100k on 8×H100 SXM dense bf16 (peak 989.5 TFLOPS,
      MFU=0.35, effective ≈ 2.77 PFLOPS): dense FLOPs = 2×32e9×T;
      attention FLOPs = L × Hq × (qk_dim + v_dim) × T² (causal, MAC×2)
      = 61 × 64 × (192+128) × T². At T=100k total prefill ≈ 1.89e16 FLOPs
      → 2.77e15/(1.89e11 FLOPs/tok) ≈ 14,659 tok/s. The K8 baseline
      profile. Numbers verified against
      `kv-transfer-early-experiment/prefill-breakeven.py`.

  vanilla_gqa_fp16:
    active_params_b: 70
    kv_bytes_per_token: 327680
    single_stream_prefill_tok_s: 10221
    notes: >-
      Llama-3-70B class GQA, FP16. 80 layers × 8 KV heads × 128 head_dim
      × 2 (K+V) × 2 bytes = 327,680 bytes/token. Per-stream prefill at
      T=100k: dense=2×70e9 FLOPs/tok, attn=80×64×(128+128)×T = 80×64×256×T
      ≈ 1.31 TF/tok → effective ≈ 10,221 tok/s. The "still-deployed
      dense GQA" reference for sensitivity sweeps.

  frontier_v4_fp8:
    active_params_b: 49
    kv_bytes_per_token: 9928
    single_stream_prefill_tok_s: 5607
    notes: >-
      DeepSeek-V4-Pro (CSA/HCA sequence-compressed KV). 49B active,
      61 layers; KV is c4a/c128a mix per vLLM's public arithmetic
      (30 c4a layers see ⌈T/4⌉ entries, 31 c128a layers see ⌈T/128⌉).
      At T=100k effective kv_bpt ≈ 9,928 (sequence-compressed; we
      approximate as a constant per-token bookkeeping value). Per-stream
      prefill: dense=2×49e9×T, attn ≈ 0.495 × 61 × 128 × (512+512) × T²
      reflecting the c4a/c128a compression mix → ≈5,607 tok/s at T=100k.
      Numbers verified against
      `kv-transfer-early-experiment/prefill-breakeven.py`'s
      `deepseek_v4_pro_kv_bytes` and `deepseek_v4_attention_scale`.

  glm_5_mla:
    active_params_b: 40
    kv_bytes_per_token: 89856
    single_stream_prefill_tok_s: 8244
    notes: >-
      GLM-5 (zai-org, 2026; 744B total / 40B active, 78 softmax layers,
      MLA + DSA). kv_bpt = L × (kv_lora_rank + qk_rope_dim) × 2 = 78 ×
      (512 + 64) × 2 = 89,856. Per-stream prefill at T=100k: dense=2×40e9×T,
      attn=78×64×(256+256)×T² → ≈8,244 tok/s. Replaces the earlier
      "glm_full_mha" / "glm_4_6_gqa" placeholders: GLM-5 is the public
      reference, and it uses MLA, not full-MHA — the 1.28 MB/token
      figure that appeared in the original kv-transfer-early-experiment
      table was miscoded full-MHA arithmetic on a model that is in fact
      MLA. Numbers verified against the corrected
      `kv-transfer-early-experiment/prefill-breakeven.py`.

  qwen3_next_hybrid:
    active_params_b: 3
    kv_bytes_per_token: 24576
    single_stream_prefill_tok_s: 175316
    notes: >-
      Qwen3-Next-80B-A3B (HF card: 80B total / 3B active, hybrid
      DeltaNet + 12 softmax layers, n_kv=2, head_dim=256, 256K native
      context). kv_bpt = 12 × 2 × 256 × 2 (K+V) × 2 (bf16) = 24,576
      bytes/token (only softmax layers contribute KV; DeltaNet branches
      are part of active-params dense cost). Per-stream prefill at
      T=100k: dense=2×3e9×T, attn=12×16×512×T² → ≈175,316 tok/s. Light
      KV + cheap replay; crossover ~20 Gbps. Numbers verified against
      the corrected `kv-transfer-early-experiment/prefill-breakeven.py`.
