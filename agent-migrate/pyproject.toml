[project]
name = "agent-migrate-agent"
version = "0.1.0"
description = "State-mobility layer between agent harnesses and serving backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "matplotlib>=3.7",
  "pandas>=2.3.3",
  "seaborn>=0.13",
  "cvxpy>=1.7.5",
]

[tool.pytest.ini_options]
testpaths = ["tests", "convex-allocation/tests", "evacuation/tests", "queue-haul/tests"]
norecursedirs = ["runs", ".venv", ".git", "dist", "build", "kv-transfer-early-experiment", "long-term-plans"]

[dependency-groups]
dev = ["pytest>=8"]
