[project]
name = "agent-migrate-agent"
version = "0.1.0"
description = "Research experiments for LLM state migration, evacuation, and power-shed planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "matplotlib>=3.7",
  "pandas>=2.3.3",
  "seaborn>=0.13",
  "cvxpy>=1.7.5",
  "highspy>=1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evacuation/tests", "queue-haul/tests"]
norecursedirs = ["runs", ".venv", ".git", "dist", "build", "kv-transfer-early-experiment", "long-term-plans"]

[tool.uv.workspace]
members = [
    "queue-haul/native",
]

[tool.uv.sources]
queue-haul-native = { workspace = true }

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pytest>=8",
]
native = [
    "queue-haul-native",
]
