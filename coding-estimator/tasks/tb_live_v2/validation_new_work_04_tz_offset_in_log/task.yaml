descriptions:
  - key: base
    description: |
      Write `count_recent.py` in the workspace. The script reads a
      log file (path passed as the first argument) and prints the
      number of log entries with timestamps strictly after a given
      cutoff (passed as the second argument).

      Each line of the log starts with an ISO-8601 timestamp,
      followed by a single space and a free-form message:

          <iso8601-timestamp> <message...>

      Invocation:
          python count_recent.py path/to/log.txt 2026-01-01T00:00:00Z
          # prints something like: 17

      Constraints:
        - Use only the Python standard library.
        - Lines that fail to parse must be silently skipped.
        - Print the count followed by a newline; exit 0.
author_email: estimator-team@coding-estimator.local
difficulty: hard
tags: [validation_new_work, datetime, python]
max_agent_timeout_sec: 90
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
