target_shape: validation_new_work
secondary_shapes: [progress_drop]
expected_pass_rate: 0.30
notes: |
  The verifier fixture mixes timestamp formats:
    - 2026-03-01T12:00:00Z          (Zulu / UTC)
    - 2026-03-01T13:00:00+00:00     (explicit zero offset)
    - 2026-03-01T14:00:00+02:00     (offset; UTC equivalent is 12:00)
    - 2026-03-01T15:30:00-05:00     (offset; UTC equivalent is 20:30)

  Naive impl: `datetime.fromisoformat(s.split()[0])`. On Python
  3.11+, this handles `+HH:MM` but NOT the trailing `Z`. Naive
  agents fail the `Z` lines. A common second attempt strips `Z`
  but treats it as naive UTC, which then mis-orders against
  offset-bearing timestamps.

  Description deliberately does not mention timezones at all. Spec
  says "ISO-8601 timestamp"; reading carefully, the agent must
  infer Z + offsets are part of the surface.

  Correct impl: replace trailing `Z` with `+00:00` before
  fromisoformat, OR use `datetime.fromisoformat` with a manual
  Z-handler, then compare with timezone-aware cutoffs.
