target_shape: progress_drop
secondary_shapes: []
expected_pass_rate: 0.40
notes: |
  The trap is the silent str↔int handoff between the two functions.
  Naive `parse_orders` uses `csv.DictReader` and returns rows with
  string values for every column. Naive `total_revenue` does
  `sum(o["qty"] * o["unit_price"] for o in orders)` — Python's
  `*` on two strings of digits raises TypeError, but on a string
  of digits and an int it would be string-replication. Either way,
  the integration test exposes that one or both functions need
  type coercion.

  Description deliberately does NOT mention type coercion or
  numeric types — the spec just says "returns a list of dicts".
  Agents who unit-test each function in isolation feel done; the
  CLI integration test (verifier path) catches the handoff.

  Common recovery shapes:
    - Coerce inside parse_orders (cast qty/unit_price to int/float).
    - Coerce inside total_revenue.
    - Both — overkill but passes verifier.
