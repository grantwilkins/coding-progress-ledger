descriptions:
  - key: base
    description: |
      Write /app/tsv_to_json.py. The script reads a TSV file passed as
      its first argument and writes a JSON array (one object per data
      row, keyed by the header row) to stdout.

      Example invocation:
          python /app/tsv_to_json.py input.tsv

      Required behavior:
        - The first line is the header.
        - Each subsequent non-empty line is a data row.
        - Fields are separated by literal tab characters.
        - A field MAY be quoted with double quotes ("..."); inside a
          quoted field, literal tab characters are part of the field
          value (not separators).
        - Output: a single JSON array, valid JSON parseable by
          json.loads, sorted by key insertion order from the header.
        - Use only the Python standard library.
author_email: estimator-team@coding-estimator.local
difficulty: medium
tags: [validation_new_work, parsing, python]
max_agent_timeout_sec: 90
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
