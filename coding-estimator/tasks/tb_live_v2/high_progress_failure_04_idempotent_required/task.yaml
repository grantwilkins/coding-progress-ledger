descriptions:
  - key: base
    description: |
      Write `apply_migration.py` in the workspace. The script reads
      a JSON file `state.json` in the workspace, applies the
      migration described below, and writes the result back to
      `state.json` (overwriting it).

      Migration:
        - Read the current state, which is a JSON object with at
          least a top-level array key `users`. Each entry in
          `users` is an object with a string key `name`.
        - Add a new top-level key `version` set to integer `2` if
          it is not already present and equal to 2.
        - For each user, ensure a key `migrated` is set to `true`.
        - Sort the `users` array by name (case-sensitive ASCII order).

      Required behavior:
        - `python apply_migration.py` (run from the workspace root)
          applies the migration in place.
        - Use only the Python standard library.
        - The script MUST be safely idempotent: running it twice
          (or N times) on the same starting state must yield the
          same final state. In particular, do NOT append duplicate
          users, do NOT bump `version` past 2, and do NOT alter
          users that are already migrated.

      The verifier runs the script TWICE and compares the resulting
      state to a known fixture.
author_email: estimator-team@coding-estimator.local
difficulty: hard
tags: [high_progress_failure, migrations, python]
max_agent_timeout_sec: 90
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
