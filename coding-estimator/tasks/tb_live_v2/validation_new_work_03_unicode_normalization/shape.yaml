target_shape: validation_new_work
secondary_shapes: []
expected_pass_rate: 0.40
notes: |
  Spec deliberately says nothing about unicode. Naive impl is
  `needle.lower() in haystack.lower()`.

  The verifier fixture has strings where the same character is
  encoded as either:
    - Composed: `é` (é, single code point)
    - Decomposed: `e` + `́` (e, combining acute)

  Both render identically. Naive substring matching fails.

  Correct fix: NFC-normalize both inputs before comparison via
  `unicodedata.normalize("NFC", ...)`. The hint is that the spec
  says "haystack contains needle" and visual identity is what users
  expect — but the spec doesn't mention this.
