descriptions:
  - key: base
    description: |
      Implement `search.py` in the workspace exposing one function:

          def matches(haystack: str, needle: str) -> bool:
              ...

      Returns True if `needle` appears as a substring of `haystack`.
      Comparison is case-insensitive (ASCII upper/lower).

      Use only the Python standard library. The function signature
      and module name are fixed. No CLI required.
author_email: estimator-team@coding-estimator.local
difficulty: medium
tags: [validation_new_work, unicode, python]
max_agent_timeout_sec: 90
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
