descriptions:
  - key: base
    description: |
      The workspace contains a shell script `build.sh`. When you
      execute it via `./build.sh`, it should produce a file
      `dist/output.txt` containing exactly the line:

          build complete

      Currently `./build.sh` does not run successfully. Make
      `./build.sh` (executed from the workspace root) succeed and
      produce the expected `dist/output.txt`.

      Constraints:
        - Do NOT rewrite the script's logic. The script's contents
          are correct.
        - Do not invoke the script via `bash build.sh` or
          `sh build.sh` — the verifier runs it as `./build.sh`.
        - The smallest fix is preferred.
author_email: estimator-team@coding-estimator.local
difficulty: medium
tags: [stuck_blocked, shell, permissions]
max_agent_timeout_sec: 90
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
