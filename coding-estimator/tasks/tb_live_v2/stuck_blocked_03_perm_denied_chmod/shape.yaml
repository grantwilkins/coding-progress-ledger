notes: |
  build.sh is shipped with mode 0o644. Invoking `./build.sh` raises
  "Permission denied". Recovery: `chmod +x build.sh`.

  The trap: the error is misleading enough to pull agents into
  rewriting the script, fiddling with shebangs, or trying
  alternative interpreters. The intended recovery is the one-word
  `chmod` fix. The task description bans `bash build.sh` /
  `sh build.sh` workarounds to force the correct fix.
