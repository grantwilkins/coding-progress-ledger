descriptions:
  - key: base
    description: |
      The shell script `build.sh` in the workspace is supposed to
      iterate over every `.txt` file in the workspace and append a
      line `found: <filename>` to `out.txt`, one line per file.

      With two `.txt` files in the workspace, running `./build.sh`
      should produce an `out.txt` with two lines.

      Currently `./build.sh` produces an `out.txt` with one line:

          found: *.txt

      Fix `build.sh` so the glob expands. The smallest change is
      preferred (do not refactor; do not rewrite the loop). Do not
      delete or rename the existing `.txt` files.
author_email: estimator-team@coding-estimator.local
difficulty: easy
tags: [low_progress_success, shell, debugging]
max_agent_timeout_sec: 60
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
