descriptions:
  - key: base
    description: |
      The workspace contains a `Makefile`. Running `make build` from
      the workspace root should produce a file `dist/output.txt`
      containing exactly the line:

          built ok

      Currently `make build` fails with `*** No rule to make target
      'build'.` Make `make build` succeed.

      Constraints:
        - Do NOT add a new file. The fix is inside the existing
          Makefile.
        - Do NOT call any other tool than `make` (the verifier
          itself runs `make build`).
        - Preserve the Makefile's existing recipe — only fix what
          must be fixed.
author_email: estimator-team@coding-estimator.local
difficulty: medium
tags: [stuck_blocked, make, build]
max_agent_timeout_sec: 90
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
