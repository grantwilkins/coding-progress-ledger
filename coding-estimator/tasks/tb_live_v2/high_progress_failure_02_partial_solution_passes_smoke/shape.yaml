target_shape: high_progress_failure
secondary_shapes: [validation_new_work]
expected_pass_rate: 0.40
notes: |
  Naive impl: regex `(\d+)([smhd])` and sum. That handles bare units
  ("5m") and simple combinations ("1h30m"), and feels complete after
  a smoke test. Verifier strict checks:
    1. The bare integer "0" must return 0 (naive regex impl rejects it).
    2. Whitespace must be allowed inside ("1h 30m"); naive impl rejects.
    3. Out-of-order ("1m30h") MUST raise ValueError; naive impl
       silently sums them.

  Each of these is a subtle "I thought I was done" moment — the
  high_progress_failure shape: many subtasks visibly complete (the
  basic units + simple combinations all work), but the strict
  verifier catches the cases that distinguish a real parser from a
  regex-and-add.
