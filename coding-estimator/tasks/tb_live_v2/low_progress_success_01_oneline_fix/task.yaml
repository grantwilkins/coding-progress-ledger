descriptions:
  - key: base
    description: |
      The script /app/sum_evens.py is supposed to print the sum of the
      even numbers in a comma-separated list of integers passed on
      stdin. For example:

          echo "1,2,3,4" | python /app/sum_evens.py
          # should print: 6

      It currently prints 4. Fix it. Do not refactor; the smallest
      change that makes it correct is preferred.
