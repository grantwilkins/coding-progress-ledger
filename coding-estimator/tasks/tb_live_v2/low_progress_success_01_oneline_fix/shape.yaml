target_shape: low_progress_success
secondary_shapes: []
expected_pass_rate: 0.85
notes: |
  The fix is a single-character edit: change `% 2 == 1` to `% 2 == 0`
  on the filter line. Agents that read first and edit second produce a
  trajectory with very few discovered subtasks (one investigation, one
  edit, one validation), giving a low-progress success shape.

  This task exists primarily so the corpus contains the LOW-PROGRESS
  end of the success distribution. Without it, every success looks
  like a long, thorough trajectory — which biases shape labels.
