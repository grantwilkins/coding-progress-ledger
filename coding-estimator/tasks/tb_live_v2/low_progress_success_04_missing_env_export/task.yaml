descriptions:
  - key: base
    description: |
      The script `report.py` in the workspace reads the environment
      variable `DATA_DIR` and prints the count of `.csv` files in
      that directory.

      A `.env` file in the workspace is intended to provide the
      value of `DATA_DIR`. The repo convention is that `.env` is
      a simple `KEY=VALUE` file (no quoting, no `export`).

      Currently `python report.py` does not produce the right output.
      Make it print `csv_count=2` (there are exactly two `.csv` files
      under `data/`).
author_email: estimator-team@coding-estimator.local
difficulty: easy
tags: [low_progress_success, environment, python]
max_agent_timeout_sec: 60
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
