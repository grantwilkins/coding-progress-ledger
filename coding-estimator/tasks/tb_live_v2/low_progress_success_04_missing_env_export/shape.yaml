target_shape: low_progress_success
secondary_shapes: []
expected_pass_rate: 0.75
notes: |
  The fix is single-line: write `DATA_DIR=data` into `.env`. The
  task ships an empty .env. Verifier loads `.env` itself and runs
  `python report.py` with `DATA_DIR` set from the parsed file.

  Subtle traps that pull lazy agents off the path:
    - .env says "no quoting, no export" — agents who write
      `export DATA_DIR=data` violate the convention and the
      verifier's parser rejects it.
    - Agents who modify report.py to hardcode `data` instead of
      writing .env are also off-spec; verifier checks .env content.
