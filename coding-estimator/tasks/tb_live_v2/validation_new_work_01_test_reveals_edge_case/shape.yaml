target_shape: validation_new_work
secondary_shapes: [progress_drop]
expected_pass_rate: 0.55
notes: |
  Naive draft uses `(end - start).days` after parsing both. That works
  for most cases. The hidden trap is the spec line "reject inputs that
  are not valid ISO-8601 dates with a ValueError" — the agent's first
  pass typically uses `datetime.fromisoformat` which DOES accept
  "2026-13-40" on some Python versions and silently rolls over, OR
  fails to raise ValueError when given a YYYY-MM string. Test failure
  reveals that an explicit format validation step is needed. Validation
  surfaces new work.
