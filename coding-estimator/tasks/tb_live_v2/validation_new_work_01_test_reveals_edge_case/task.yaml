descriptions:
  - key: base
    description: |
      Implement `days_until(start_iso: str, end_iso: str) -> int` in
      /app/days_until.py. The function returns the integer number of
      whole days between `start_iso` and `end_iso` (inclusive of start,
      exclusive of end), where both inputs are ISO-8601 date strings
      (YYYY-MM-DD).

      The function must handle leap years and reject inputs that are
      not valid ISO-8601 dates with a ValueError.

      Example:
          days_until("2026-02-01", "2026-02-08") == 7
author_email: estimator-team@coding-estimator.local
difficulty: medium
tags: [validation_new_work, datetime, python]
max_agent_timeout_sec: 180
max_test_timeout_sec: 30
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
