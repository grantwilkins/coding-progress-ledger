descriptions:
  - key: base
    description: |
      Write `count_users.py` in the workspace. The script reads a
      JSON-Lines file (one JSON object per line) passed as its first
      argument, and prints the number of distinct values of the
      `"user"` field across all valid records.

      Example:
          python count_users.py events.jsonl
          # prints something like: 7

      Required behavior:
        - Each line is parsed independently as JSON.
        - Lines that fail to parse OR that lack a `"user"` field
          MUST be skipped (not counted, not raised).
        - Empty lines MUST be skipped.
        - The output is the count of distinct user values among the
          valid records, printed as a decimal integer followed by a
          newline.
        - Use only the Python standard library.
        - Exit 0 on success, even if some lines were malformed.
author_email: estimator-team@coding-estimator.local
difficulty: medium
tags: [validation_new_work, parsing, python]
max_agent_timeout_sec: 90
max_test_timeout_sec: 15
test_scripts: [setup-uv-pytest.sh, run-uv-pytest.sh]
run_tests_in_same_shell: true
