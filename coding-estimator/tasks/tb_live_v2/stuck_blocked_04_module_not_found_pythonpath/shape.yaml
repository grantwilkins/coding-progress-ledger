target_shape: stuck_blocked
secondary_shapes: []
expected_pass_rate: 0.45
notes: |
  The error "ModuleNotFoundError: No module named 'widget'" pulls
  agents toward `pip install widget` (which DOES exist on PyPI as
  an unrelated package — installing it gives a false-recovery loop).

  The constraints forbid pip, file moves, and __init__.py edits, so
  the recovery path is `PYTHONPATH=lib python tools/render.py` (or
  `python -m widget`-style invocations).

  Without the constraints, agents would just `cp lib/widget.py .` or
  add an `__init__.py`. The constraints deliberately funnel them to
  the PYTHONPATH/path manipulation recovery, which is the
  educational shape: the trap is the wrong reflexive recovery (pip),
  the correct recovery is environment manipulation.
