# Two-site MVP profile.
#
# Important assumptions encoded here — change them deliberately.
#
# `effective_bps` is the *single-flow inter-region* bandwidth a single
# in-flight migration would achieve. It is NOT a backbone capacity.
#
#   AWS hard-caps single-flow non-cluster traffic at ~5 Gbps; ENA Express
#   (the only path to higher single-flow rates) does not work cross-AZ
#   or cross-region. Long-haul TCP (CUBIC/BBR) at ~30 ms RTT typically
#   sustains 1-10 Gbps per flow without aggressive tuning. 5 Gbps is the
#   defensible single-flow point estimate.
#   See: AWS EC2 instance network bandwidth docs; CacheGen (SIGCOMM '24);
#        Mooncake (FAST '25 / arXiv 2407.00079).
#
#   For aggregate / multi-flow / RDMA fabrics, override with the bench
#   `--sites-config` flag and supply a different YAML.
#
# `prefill_tok_s` is interpreted as the rate at which an arriving request's
# fresh context tokens are processed (single-stream, not aggregate server
# throughput). Defensible single-stream range for a ~50B-active MoE on
# 8x H100/H200 at moderate context: 15K-60K tok/s. The 1.5x asymmetry
# (phoenix=H100-class, seattle=H200-class) maps to published
# memory-bandwidth ratios. At long context (>32K), prefill drops materially
# because attention FLOPs are O(T^2); the toy trace lives in the linear
# regime.
#
# RTT and path metadata are documentation — they are not consumed by the
# loader, but reviewers should be able to audit the regime.

home_site: phoenix

path:
  region_a: phoenix          # us-west-2-az style; aws-region us-west-2
  region_b: seattle          # exemplar second region; not a real aws region label
  great_circle_km: 1500
  rtt_ms_p50: 30             # AWS inter-region backbone, typical
  transport_regime: single_flow_tcp_inter_region

sites:
  phoenix:
    prefill_tok_s: 30000     # H100-class, 8 GPU, ~50B-active MoE, T<=32K
  seattle:
    prefill_tok_s: 45000     # H200-class, 8 GPU, same regime, ~1.5x faster

links:
  phoenix-seattle:
    # 5 Gbps = 5e9 bps. Single-flow inter-region effective bandwidth.
    # See header comment for derivation.
    effective_bps: 5_000_000_000
    multi_flow_factor: 1     # documentation only; not consumed by loader.
                             # Set to N if running N parallel TCP flows
                             # and pre-multiply effective_bps yourself.
