# Three-site profile for Workstream K — landing pressure scenarios.
#
# Per A2: regime C (landing-pressure-dominates) requires destination
# contention, which the 2-site profile cannot exercise alone (only one
# destination from any source). Three sites give us:
#   - phoenix: source-side (single-source-evacuation default origin)
#   - seattle: faster-prefill destination (1.5x phoenix; matches sites_2site)
#   - austin:  slower-prefill destination, larger workspace_hydrate_bps
#              (a "more local-storage-rich but more compute-constrained"
#               class of destination)
#
# The K-extension fluid-capacity fields (workspace_hydrate_bps, kv_memory_bytes)
# are now explicitly set per site. The MVP 2-site config leaves them at
# math.inf via the SiteProfile defaults (backward-compat).
#
# All links are 5 Gbps single-flow inter-region (matches sites_2site rationale).

home_site: phoenix

path:
  region_a: phoenix
  region_b: seattle
  region_c: austin
  great_circle_km_pa_sa: 1500
  great_circle_km_pa_au: 1300
  great_circle_km_sa_au: 2700
  rtt_ms_p50: 30
  transport_regime: single_flow_tcp_inter_region

sites:
  phoenix:
    prefill_tok_s: 30000           # H100-class single-stream
    workspace_hydrate_bps: 1.0e+9  # 1 GB/s disk/object-store hydrate
    kv_memory_bytes: 1.0e+11       # 100 GB resident KV capacity
  seattle:
    prefill_tok_s: 45000           # H200-class single-stream (1.5x phoenix)
    workspace_hydrate_bps: 1.0e+9
    kv_memory_bytes: 1.0e+11
  austin:
    prefill_tok_s: 22500           # 0.75x phoenix (older H100 / lower clock)
    workspace_hydrate_bps: 4.0e+9  # 4 GB/s — local NVMe pool
    kv_memory_bytes: 5.0e+10       # 50 GB resident KV (smaller HBM pool)

links:
  phoenix-seattle:
    effective_bps: 5_000_000_000
    multi_flow_factor: 1
  phoenix-austin:
    effective_bps: 5_000_000_000
    multi_flow_factor: 1
  seattle-austin:
    effective_bps: 5_000_000_000
    multi_flow_factor: 1
