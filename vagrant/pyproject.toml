[project]
name = "vagrant-agent"
version = "0.1.0"
description = "State-mobility layer between agent harnesses and serving backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "coding-progress-ledger",
]

[project.scripts]
vagrant-trace = "vagrant_agent.cli:trace_main"
vagrant-manifest = "vagrant_agent.cli:manifest_main"
vagrant-bench = "vagrant_agent.cli:bench_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vagrant_agent*"]

[tool.uv.sources]
coding-progress-ledger = { path = "../coding-progress-ledger", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["runs", ".venv", ".git", "dist", "build", "kv-transfer-early-experiment", "long-term-plans"]

[dependency-groups]
dev = ["pytest>=8"]
