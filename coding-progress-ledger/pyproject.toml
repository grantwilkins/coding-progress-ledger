[project]
name = "coding-progress-ledger"
version = "0.1.0"
description = "Deterministic progress ledger for discovered coding work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ledger-run = "ledger_progress.run_manager:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger_progress*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "runs",
  ".venv",
  ".git",
  "dist",
  "build",
]

[dependency-groups]
dev = ["pytest>=8"]
