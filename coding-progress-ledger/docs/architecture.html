<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Progress Ledger — Architecture</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0b0b12;
  color: #c0c0d8;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  padding: 14px 28px;
  border-bottom: 1px solid #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  background: #0d0d18;
}

header h1 {
  font-size: 13px;
  font-weight: 700;
  color: #e0e0f8;
  letter-spacing: 0.04em;
}

header p {
  font-size: 10px;
  color: #505070;
  margin-top: 3px;
}

.controls {
  display: flex;
  gap: 8px;
}

.btn {
  font-family: inherit;
  font-size: 10px;
  padding: 5px 14px;
  border: 1px solid #252540;
  border-radius: 5px;
  background: #14142a;
  color: #9090c0;
  cursor: pointer;
  transition: all 0.12s;
  letter-spacing: 0.03em;
}
.btn:hover { background: #1e1e38; border-color: #404060; color: #c0c0e8; }
.btn.active { border-color: #e67e22; color: #e67e22; background: #1e1408; }

.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.svg-pane {
  flex: 1;
  overflow: auto;
  padding: 24px 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.detail-pane {
  width: 340px;
  flex-shrink: 0;
  border-left: 1px solid #1a1a2e;
  background: #0d0d18;
  padding: 22px;
  overflow-y: auto;
}

.detail-empty {
  color: #353558;
  font-size: 11px;
  margin-top: 60px;
  text-align: center;
  line-height: 2;
}

.detail-badge {
  display: inline-block;
  font-size: 9px;
  padding: 2px 8px;
  border-radius: 3px;
  margin-bottom: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 700;
}

.detail-name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 3px;
  line-height: 1.3;
}

.detail-file {
  font-size: 9px;
  color: #404060;
  margin-bottom: 14px;
}

.detail-desc {
  font-size: 11px;
  line-height: 1.75;
  color: #9090b8;
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid #16162a;
}

.detail-section {
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #404060;
  margin: 14px 0 7px;
}

.detail-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.detail-list li {
  font-size: 10px;
  padding: 4px 9px;
  background: #111125;
  border-radius: 4px;
  color: #8080b0;
  line-height: 1.5;
  border-left: 2px solid #252545;
}

.detail-list li b { color: #a0d0a0; font-weight: 600; }
.detail-list li em { color: #8ab4f8; font-style: normal; }
.detail-list li s { color: #f08060; text-decoration: none; font-style: italic; }

.trace-step-label {
  font-size: 9px;
  color: #e67e22;
  background: #1e1204;
  border: 1px solid #e67e2240;
  border-radius: 4px;
  padding: 6px 10px;
  margin-bottom: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

/* SVG internals */
.node-group { cursor: pointer; }
.node-group:focus { outline: none; }
.node-rect { transition: filter 0.15s; }
.edge { pointer-events: none; }
.flow-label { pointer-events: none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Coding Progress Ledger — System Architecture</h1>
    <p>Click any component to inspect its interface. Use Trace to animate a <code>session.complete()</code> call through the system.</p>
  </div>
  <div class="controls">
    <button class="btn" id="btn-trace">▶ Trace complete()</button>
    <button class="btn" id="btn-reset">↺ Reset</button>
  </div>
</header>

<div class="layout">
  <div class="svg-pane">
    <svg id="arch" width="640" height="870" viewBox="0 0 640 870"></svg>
  </div>
  <div class="detail-pane" id="detail">
    <div class="detail-empty">← select a component<br>to inspect its interface</div>
  </div>
</div>

<script>

const NODES = [

      'reopen(id, step, reason) → <b>Ledger</b>',

    produces: ['mutated Ledger', 'validated event appended to ledger.events'],
    api: [
      'new_ledger(root_task) → <b>Ledger</b>  — emits INIT event',
      'apply_event(ledger, event) → <b>Ledger</b>',
      'replay(events) → <b>Ledger</b>  — rebuild from scratch',
      '<em>handlers:</em>',
      '_add_subtask  ·  _update_status  ·  _add_evidence',
      '_split_subtask  ·  _set_status (reopen/invalidate/delete)',
    ],
  },
  {
    id: 'scoring',
    label: 'score()',
    sublabel: 'scoring.py',
    file: 'ledger_progress/scoring.py',
    color: '#22c55e',
    x: 430, y: 228, w: 150, h: 98,
    badge: 'computation',
    desc: 'Computes a progress fraction from a Ledger snapshot. Finds leaf subtasks: active nodes (not INVALIDATED/DELETED) that are not parents of other active nodes. Optionally filters by category. Returns complete_weight / active_weight. Progress is 0.0 when active_weight is zero.',
    receives: ['Ledger', 'categories? (optional filter set)'],
    produces: ['ProgressObservation'],
    api: [
      'score(ledger, categories?) → <b>ProgressObservation</b>',
      '<em>leaf rule:</em> active node with no active children',
      '<em>formula:</em> complete_weight / active_weight',
      '<em>INVALIDATED + DELETED</em> excluded entirely',
    ],
  },
  {
    id: 'ledger',
    label: 'Ledger',
    sublabel: 'in-memory state · core.py',
    file: 'ledger_progress/core.py',
    color: '#a855f7',
    x: 60, y: 378, w: 230, h: 130,
    badge: 'data model',
    desc: 'The in-memory representation of all known work. Holds the subtask map and the ordered event list. Never persisted directly — only its events are serialized. Rebuilt deterministically from any event log via replay(). Two events at the same step are allowed (e.g. multiple ADD_SUBTASK calls in one discovery moment).',
    receives: ['apply_event() mutations'],
    produces: ['read by score()', 'events serialized by to_jsonl()'],
    api: [
      '<b>.root_task</b>: str',
      '<b>.subtasks</b>: dict[id → Subtask]',
      '<b>.events</b>: list[LedgerEvent]',
      '— Subtask —',
      '<b>.id</b>  <b>.description</b>  <b>.category</b>  <b>.status</b>',
      '<b>.evidence</b>: list[str]  (required for COMPLETE)',
      '<b>.weight</b>: float  (default 1.0)',
      '<b>.parent_id</b>: str | None',
      '<b>.created_at_step</b>  <b>.updated_at_step</b>',
      '— LedgerEvent —',
      '<b>.step</b>  <b>.event_type</b>  <b>.subtask_id</b>  <b>.payload</b>  <b>.reason</b>',
    ],
  },
  {
    id: 'queries',
    label: 'queries.py',
    sublabel: 'CODING_CATEGORIES filter',
    file: 'ledger_progress/queries.py',
    color: '#22c55e',
    x: 340, y: 378, w: 240, h: 80,
    badge: 'query',
    desc: 'Convenience query layer over a Ledger. CODING_CATEGORIES = (PRODUCT, VALIDATION, INVESTIGATION) — excludes ARTIFACT, DOCUMENTATION, ENVIRONMENT from the denominator when measuring pure coding progress. The same leaf detection logic as scoring.py.',
    receives: ['Ledger', 'optional category filter'],
    produces: ['list[Subtask] — sorted by created_at_step, then id'],
    api: [
      '<b>CODING_CATEGORIES</b> = (PRODUCT, VALIDATION, INVESTIGATION)',
      'active_incomplete_leaves(ledger, categories?) → <b>[Subtask]</b>',
      'active_incomplete_coding_leaves(ledger) → <b>[Subtask]</b>',
    ],
  },
  {
    id: 'enums',
    label: 'Enums & Status',
    sublabel: 'core.py',
    file: 'ledger_progress/core.py',
    color: '#a855f7',
    x: 340, y: 488, w: 240, h: 95,
    badge: 'types',
    desc: 'Enumerated constants shared across all layers. Status controls what counts in scoring (active = not INVALIDATED/DELETED). EventType is the dispatch key in apply_event(). SubtaskCategory partitions work into scoring buckets.',
    receives: [],
    produces: [],
    api: [
      '<em>Status:</em> NOT_STARTED · IN_PROGRESS · BLOCKED',
      '          COMPLETE · INVALIDATED · DELETED',
      '<em>EventType:</em> INIT · ADD_SUBTASK · UPDATE_STATUS',
      '            ADD_EVIDENCE · SPLIT_SUBTASK',
      '            REOPEN_SUBTASK · INVALIDATE_SUBTASK · DELETE_SUBTASK',
      '<em>SubtaskCategory:</em> PRODUCT · VALIDATION · INVESTIGATION',
      '                  ENVIRONMENT · ARTIFACT · DOCUMENTATION',
    ],
  },
  {
    id: 'serialization',
    label: 'serialization.py',
    sublabel: 'JSONL read / write · replay',
    file: 'ledger_progress/serialization.py',
    color: '#f43f5e',
    x: 60, y: 558, w: 230, h: 70,
    badge: 'i/o',
    desc: 'Reads and writes the event log as newline-delimited JSON. One LedgerEvent per line. from_jsonl() loads events then calls core.replay() to reconstruct the full in-memory Ledger. The JSONL file is the only artifact that must be preserved — everything else is derived.',
    receives: ['Ledger.events (on write)', 'path to ledger.jsonl (on read)'],
    produces: ['ledger.jsonl (write)', 'Ledger via replay (read)'],
    api: [
      'to_jsonl(ledger, path)  ← export events',
      'from_jsonl(path) → <b>Ledger</b>  ← load + replay',
      'write_events_jsonl(events, path)',
      'load_events_jsonl(path) → <b>[LedgerEvent]</b>',
      'event_to_dict(event) → dict',
      'event_from_dict(dict) → <b>LedgerEvent</b>',
    ],
  },
  {
    id: 'jsonl',
    label: 'ledger.jsonl',
    sublabel: 'append-only event log · source of truth',
    file: 'runs/<name>/ledger.jsonl',
    color: '#f59e0b',
    x: 60, y: 678, w: 230, h: 52,
    badge: 'artifact',
    desc: 'Newline-delimited JSON — one LedgerEvent per line. The canonical artifact. All derived outputs (progress.csv, summaries, CSVs) can be regenerated from it via replay(). Must never be mutated after writing; treated as append-only.',
    receives: ['write_events_jsonl()'],
    produces: ['load_events_jsonl() → replay()', 'ledger-run export-run', 'scripts/ bulk load'],
    api: [
      '{"step":1,"event_type":"init","subtask_id":null,"payload":{...},"reason":null}',
      '{"step":2,"event_type":"add_subtask","subtask_id":"S1","payload":{...}}',
      '{"step":4,"event_type":"update_status","subtask_id":"S1","payload":{"status":"complete","evidence":[...]}}',
      '… one event per line, never modified after write',
    ],
  },
  {
    id: 'run_manager',
    label: 'run_manager.py',
    sublabel: 'ledger-run CLI',
    file: 'ledger_progress/run_manager.py',
    color: '#06b6d4',
    x: 340, y: 648, w: 240, h: 82,
    badge: 'cli',
    desc: 'CLI entrypoint for managing run artifact directories. Reads ledger.jsonl to produce derived CSVs and summaries. Shells out to capture test output and git diffs. Calls into rescore_suite_by_category.py (loaded as a module) for per-category breakdowns.',
    receives: ['ledger.jsonl', 'run_dir path', 'test command (capture-tests)'],
    produces: ['progress.csv', 'progress_by_category.csv', 'summary_by_category.json', 'final_diff.patch', 'test_output.txt', 'run_manifest.json'],
    api: [
      'init-run <run_dir>  ← scaffold dir + manifest',
      'export-run <run_dir>  ← regenerate CSVs from ledger.jsonl',
      'capture-tests <run_dir> -- <cmd>  ← run + save output',
      'capture-diff <run_dir>  ← git diff → final_diff.patch',
      'check-run <run_dir>  ← verify required artifacts exist',
      'summarize-run <run_dir>  ← print metrics',
    ],
  },
  {
    id: 'scripts',
    label: 'scripts/',
    sublabel: 'rescore_suite_by_category.py  ·  list_active_incomplete_coding_leaves.py',
    file: 'scripts/',
    color: '#64748b',
    x: 60, y: 790, w: 520, h: 50,
    badge: 'offline analysis',
    desc: 'Offline batch utilities. rescore_suite_by_category.py bulk-loads all runs/, infers/overrides categories from descriptions, generates per-category CSVs, audits evidence quality (strong: test_output/diff/file_exists/command_output vs. weak: everything else), detects nonmonotonic drops, and writes suite-level markdown summaries. list_active_incomplete_coding_leaves.py queries a single ledger.jsonl for remaining PRODUCT/VALIDATION/INVESTIGATION work.',
    receives: ['runs/ directory (rescore)', 'single ledger.jsonl (list script)'],
    produces: ['SUITE_SUMMARY.md', 'SUITE_CATEGORY_SUMMARY.md', 'LEDGER_AUDIT.md', 'progress_by_category.csv per run'],
    api: [
      'rescore_suite_by_category.py  ← bulk suite analysis + evidence audit',
      'list_active_incomplete_coding_leaves.py [--format json|text]',
    ],
  },
];

const nodeById = Object.fromEntries(NODES.map(n => [n.id, n]));

// ─── Edge definitions ─────────────────────────────────────────────────────────
// path: explicit SVG path data string
// label: short annotation
// trace: included in complete() animation
// dashed: load/replay direction

const EDGES = [
  {
    from: 'caller', to: 'session',
    path: 'M320,60 L320,100',
    lx: 330, ly: 82,
    label: 'calls session methods',
    color: '#e67e22', trace: true,
  },
  {
    from: 'session', to: 'core',
    path: 'M280,178 L280,228',
    lx: 208, ly: 208,
    label: '_apply() → apply_event()',
    color: '#3b82f6', trace: true,
  },
  {
    from: 'session', to: 'scoring',
    path: 'M505,178 L505,210 L505,228',
    lx: 522, ly: 208,
    label: 'score()',
    color: '#22c55e', trace: false,
  },
  {
    from: 'core', to: 'ledger',
    path: 'M175,326 L175,378',
    lx: 110, ly: 354,
    label: 'mutates subtasks + appends event',
    color: '#a855f7', trace: true,
  },
  {
    from: 'scoring', to: 'ledger',
    path: 'M430,290 L290,408',
    lx: 338, ly: 336,
    label: 'reads subtasks',
    color: '#22c55e', trace: false, dashed: true,
  },
  {
    from: 'scoring', to: 'queries',
    path: 'M505,326 L505,360 L460,378',
    lx: 524, ly: 354,
    label: 'same leaf logic',
    color: '#22c55e', trace: false,
  },
  {
    from: 'ledger', to: 'serialization',
    path: 'M175,508 L175,558',
    lx: 100, ly: 536,
    label: 'to_jsonl(events)',
    color: '#f43f5e', trace: true,
  },
  {
    from: 'serialization', to: 'jsonl',
    path: 'M175,628 L175,678',
    lx: 100, ly: 656,
    label: 'write events',
    color: '#f59e0b', trace: true,

  {
    from: 'jsonl', to: 'serialization',

    label: 'from_jsonl() + replay()',

  },
  {
    from: 'jsonl', to: 'run_manager',
    path: 'M290,704 L390,690',
    lx: 322, ly: 688,
    label: 'export-run reads',
    color: '#06b6d4', trace: false,
  },
  {
    from: 'run_manager', to: 'scripts',
    path: 'M400,730 L320,790',
    lx: 344, ly: 756,
    label: 'rescore module',
    color: '#64748b', trace: false,
  },
  {
    from: 'jsonl', to: 'scripts',
    path: 'M175,730 L200,790',
    lx: 148, ly: 762,
    label: 'bulk load',
    color: '#64748b', trace: false,
  },
];

// ─── Trace steps for session.complete() ──────────────────────────────────────

const TRACE = [
  { node: 'caller',        msg: 'session.complete("S1", "pytest: 2 passed", step=4)' },
  { node: 'session',       msg: 'complete() → _status(id, COMPLETE, step, evidence)\n→ _apply(step, UPDATE_STATUS, id, {status, evidence})' },
  { node: 'core',          msg: 'apply_event() dispatches to _update_status()\nvalidates: evidence exists → subtask.status = COMPLETE\nevidence appended, updated_at_step set' },
  { node: 'ledger',        msg: 'Ledger mutated in-place:\n  subtasks["S1"].status = COMPLETE\n  subtasks["S1"].evidence = ["pytest: 2 passed"]\n  events.append(LedgerEvent(step=4, UPDATE_STATUS, …))' },
  { node: 'scoring',       msg: 'score() called on updated Ledger:\n  S1 is a leaf (no active children)\n  complete_weight = 1.0, active_weight = 1.0\n  → progress = 1.0' },
  { node: 'serialization', msg: 'export_jsonl() → to_jsonl() → write_events_jsonl()\nserializes each LedgerEvent as one JSON line' },
  { node: 'jsonl',         msg: '{"step":4,"event_type":"update_status","subtask_id":"S1",\n"payload":{"status":"complete","evidence":["pytest: 2 passed"]},"reason":null}' },
];

// ─── SVG rendering ────────────────────────────────────────────────────────────

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('arch');

function svgEl(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function svgText(tag, attrs, text) {
  const e = svgEl(tag, attrs);
  e.textContent = text;
  return e;
}

// defs: arrowhead markers
const defs = svgEl('defs');

function makeMarker(id, color) {
  const m = svgEl('marker', { id, markerWidth: 7, markerHeight: 7, refX: 6, refY: 3, orient: 'auto' });
  m.appendChild(svgEl('path', { d: 'M0,0.5 L0,5.5 L7,3 z', fill: color }));
  defs.appendChild(m);
}

const edgeColors = new Set(EDGES.map(e => e.color));
edgeColors.forEach(c => {
  const safeId = c.replace('#', 'c');
  makeMarker(`arr-${safeId}`, c);
  makeMarker(`arr-d-${safeId}`, c);
});
svg.appendChild(defs);

// Draw edges
const edgeLayer = svgEl('g', { class: 'edge-layer' });
svg.appendChild(edgeLayer);

EDGES.forEach(edge => {
  const colorId = edge.color.replace('#', 'c');
  const markerId = `arr-${colorId}`;
  const pathEl = svgEl('path', {
    d: edge.path,
    fill: 'none',
    stroke: edge.color,
    'stroke-width': edge.trace ? 1.8 : 1.2,
    'stroke-dasharray': edge.dashed ? '5,3' : 'none',
    'stroke-opacity': edge.trace ? 0.65 : 0.35,
    'marker-end': `url(#${markerId})`,
    class: `edge edge-${edge.from}-${edge.to}`,
  });
  edgeLayer.appendChild(pathEl);

  if (edge.label && edge.lx !== undefined) {
    const t = svgEl('text', {
      x: edge.lx, y: edge.ly,
      'font-size': 8.5,
      'font-family': 'SF Mono, Fira Code, monospace',
      fill: edge.color,
      opacity: edge.trace ? 0.55 : 0.3,
      class: 'flow-label',
    });
    t.textContent = edge.label;
    edgeLayer.appendChild(t);
  }
});

// Draw nodes
const nodeLayer = svgEl('g', { class: 'node-layer' });
svg.appendChild(nodeLayer);

NODES.forEach(node => {
  const g = svgEl('g', {
    class: 'node-group',
    tabindex: 0,
    role: 'button',
    'aria-label': node.label,
  });

  const rx = 7;
  const bg = svgEl('rect', {
    x: node.x, y: node.y, width: node.w, height: node.h,
    rx, ry: rx,
    fill: '#0e0e1e',
    stroke: node.color,
    'stroke-width': 1.5,
    class: 'node-rect',
    id: `rect-${node.id}`,
  });
  g.appendChild(bg);

  // Color bar on left edge
  const bar = svgEl('rect', {
    x: node.x, y: node.y + rx, width: 3, height: node.h - rx * 2,
    fill: node.color,
    opacity: 0.5,
    rx: 1,
  });
  g.appendChild(bar);

  // Label
  const label = svgEl('text', {
    x: node.x + 14, y: node.y + 16,
    'font-size': 11.5,
    'font-weight': 700,
    'font-family': 'SF Mono, Fira Code, monospace',
    fill: node.color,
  });
  label.textContent = node.label;
  g.appendChild(label);

  // Sublabel
  if (node.sublabel) {
    const sub = svgEl('text', {
      x: node.x + 14, y: node.y + 28,
      'font-size': 8.5,
      'font-family': 'SF Mono, Fira Code, monospace',
      fill: node.color,
      opacity: 0.45,
    });
    sub.textContent = node.sublabel;
    g.appendChild(sub);
  }

  // API preview (first 2–3 lines)
  if (node.api && node.api.length > 0 && node.h > 70) {
    const preview = node.api.filter(a => !a.startsWith('<em>') && !a.startsWith('—')).slice(0, 3);
    preview.forEach((line, i) => {
      const clean = line.replace(/<[^>]+>/g, '').slice(0, 62);
      const t = svgEl('text', {
        x: node.x + 14, y: node.y + 41 + i * 12,
        'font-size': 8.5,
        'font-family': 'SF Mono, Fira Code, monospace',
        fill: '#444468',
      });
      t.textContent = clean;
      g.appendChild(t);
    });
  }

  g.addEventListener('click', () => selectNode(node));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') selectNode(node); });
  nodeLayer.appendChild(g);
});

// ─── Detail panel ─────────────────────────────────────────────────────────────

let activeNode = null;
let traceStepMsg = null;

function selectNode(node, traceMsg) {
  if (activeNode) resetHighlight(activeNode.id);
  activeNode = node;
  highlightNode(node.id);

  const pane = document.getElementById('detail');
  let html = `
    <div class="detail-badge" style="background:${node.color}22;color:${node.color}">${node.badge}</div>
    <div class="detail-name" style="color:${node.color}">${node.label}</div>
    <div class="detail-file">${node.file}</div>`;

  if (traceMsg) {
    html += `<div class="trace-step-label">${escHtml(traceMsg)}</div>`;
  }

  html += `<div class="detail-desc">${node.desc}</div>`;

  if (node.receives?.length) {
    html += `<div class="detail-section">Receives</div><ul class="detail-list">`;
    node.receives.forEach(r => { html += `<li><em>←</em> ${r}</li>`; });
    html += `</ul>`;
  }
  if (node.produces?.length) {
    html += `<div class="detail-section">Produces</div><ul class="detail-list">`;
    node.produces.forEach(p => { html += `<li><b>→</b> ${p}</li>`; });
    html += `</ul>`;
  }
  if (node.api?.length) {
    html += `<div class="detail-section">Interface</div><ul class="detail-list">`;
    node.api.forEach(a => { html += `<li>${a}</li>`; });
    html += `</ul>`;
  }

  pane.innerHTML = html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightNode(id) {
  const rect = document.getElementById(`rect-${id}`);
  if (rect) {
    rect.setAttribute('stroke-width', '2.5');
    rect.setAttribute('filter', `drop-shadow(0 0 8px ${nodeById[id].color}88)`);
  }
}

function resetHighlight(id) {
  const rect = document.getElementById(`rect-${id}`);
  if (rect) {
    rect.setAttribute('stroke-width', '1.5');
    rect.setAttribute('filter', '');
  }
}

function dimAll(exceptId) {
  NODES.forEach(n => {
    const g = nodeLayer.querySelector(`[aria-label="${n.label}"]`);
    if (g) g.style.opacity = n.id === exceptId ? '1' : '0.22';
  });
}

function restoreAll() {
  NODES.forEach(n => {
    const g = nodeLayer.querySelector(`[aria-label="${n.label}"]`);
    if (g) g.style.opacity = '';
  });
}

// ─── Trace animation ──────────────────────────────────────────────────────────

let traceTimer = null;
let traceIdx = 0;
let traceActive = false;

function runTrace() {
  if (traceTimer) clearInterval(traceTimer);
  traceIdx = 0;
  traceActive = true;
  document.getElementById('btn-trace').classList.add('active');
  stepTrace();
  traceTimer = setInterval(() => {
    traceIdx++;
    if (traceIdx >= TRACE.length) {
      clearInterval(traceTimer);
      traceTimer = null;
      traceActive = false;
      document.getElementById('btn-trace').classList.remove('active');
      return;
    }
    stepTrace();
  }, 1500);
}

function stepTrace() {
  const step = TRACE[traceIdx];
  const node = nodeById[step.node];
  if (activeNode && activeNode.id !== step.node) resetHighlight(activeNode.id);
  dimAll(step.node);
  selectNode(node, step.msg);
}

function doReset() {
  if (traceTimer) { clearInterval(traceTimer); traceTimer = null; }
  traceActive = false;
  traceIdx = 0;
  document.getElementById('btn-trace').classList.remove('active');
  if (activeNode) { resetHighlight(activeNode.id); activeNode = null; }
  restoreAll();
  document.getElementById('detail').innerHTML =
    '<div class="detail-empty">← select a component<br>to inspect its interface</div>';
}

document.getElementById('btn-trace').addEventListener('click', runTrace);
document.getElementById('btn-reset').addEventListener('click', doReset);
</script>
</body>
